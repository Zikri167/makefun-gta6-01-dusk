<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Verde Heat — Costa Verde</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0c1218; font-family: 'Segoe UI', system-ui, sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; z-index: 5; }
  .hud-tl { position: absolute; top: 14px; left: 16px; }
  .hud-cash { font-size: 30px; font-weight: 800; color: #7ddb8a; text-shadow: 0 2px 6px rgba(0,0,0,.7); }
  .hud-hp { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .hud-hp-label { font-size: 12px; font-weight: 700; letter-spacing: 1px; text-shadow: 0 1px 3px #000; }
  .hud-hp-bar { width: 150px; height: 12px; background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.5); border-radius: 6px; overflow: hidden; }
  .hud-hp-fill { height: 100%; width: 100%; background: #4da34d; transition: width .2s; }
  .hud-stars { position: absolute; top: 12px; right: 18px; font-size: 30px; letter-spacing: 4px; color: rgba(255,255,255,.55); text-shadow: 0 2px 6px #000; }
  .hud-stars.hot { color: #ffd23d; }
  .hud-stars.flash { transform: scale(1.15); }
  .hud-objective { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); max-width: 46%; background: rgba(0,0,0,.55); border: 1px solid rgba(255,210,61,.6); border-radius: 8px; padding: 8px 14px; font-size: 15px; font-weight: 600; text-align: center; }
  .hud-br { position: absolute; right: 16px; bottom: 16px; text-align: right; }
  .hud-speed { font-size: 26px; font-weight: 800; text-shadow: 0 2px 6px #000; margin-bottom: 6px; }
  .hud-map { border: 2px solid rgba(255,255,255,.65); border-radius: 8px; background: #20262b; box-shadow: 0 4px 14px rgba(0,0,0,.5); }
  .hud-bl { position: absolute; left: 16px; bottom: 16px; }
  .hud-ammo { font-size: 18px; font-weight: 800; text-shadow: 0 2px 6px #000; }
  .hud-keys { font-size: 12px; opacity: .85; margin-top: 4px; text-shadow: 0 1px 3px #000; }
  .hud-msg { position: absolute; left: 50%; bottom: 110px; transform: translateX(-50%); background: rgba(0,0,0,.6); padding: 8px 16px; border-radius: 8px; font-size: 15px; opacity: 0; transition: opacity .25s; white-space: nowrap; }
  .hud-msg.show { opacity: 1; }
  .hud-hint { position: absolute; left: 50%; bottom: 70px; transform: translateX(-50%); background: rgba(255,210,61,.92); color: #222; padding: 6px 14px; border-radius: 8px; font-size: 14px; font-weight: 700; opacity: 0; }
  .hud-hint.show { opacity: 1; }
  .hud-banner { position: absolute; left: 50%; top: 22%; transform: translateX(-50%) scale(.96); text-align: center; opacity: 0; transition: opacity .3s, transform .3s; }
  .hud-banner.show { opacity: 1; transform: translateX(-50%) scale(1); }
  .hud-banner-title { font-size: 44px; font-weight: 900; letter-spacing: 2px; color: #ffd23d; text-shadow: 0 3px 12px #000, 0 0 30px rgba(255,210,61,.5); }
  .hud-banner-sub { font-size: 17px; margin-top: 6px; text-shadow: 0 2px 6px #000; }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: linear-gradient(180deg, rgba(8,20,32,.82), rgba(8,20,32,.55)); pointer-events: auto; padding: 20px; }
  .overlay.hidden { display: none; }
  .overlay h1 { font-size: 64px; margin: 0; letter-spacing: 4px; color: #ffd23d; text-shadow: 0 4px 18px rgba(0,0,0,.8); }
  .overlay-pause h1, .overlay-busted h1, .overlay-wasted h1 { color: #ff5a4d; }
  .game-sub { font-size: 19px; margin: 10px 0 4px; }
  .game-story { max-width: 560px; font-size: 15px; line-height: 1.5; opacity: .92; }
  .game-controls { font-size: 13px; opacity: .8; margin-top: 18px; }
  .game-saved { font-size: 13px; color: #7ddb8a; }
  .big-btn { pointer-events: auto; margin-top: 22px; font-size: 20px; font-weight: 800; letter-spacing: 1px; color: #1a1a1a; background: #ffd23d; border: none; border-radius: 10px; padding: 14px 34px; cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,.5); }
  .big-btn:hover { background: #ffe06a; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="game" aria-label="Verde Heat: open-world crime game in Costa Verde"></canvas>
<div id="hud"></div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/boot.js"></script>
</body>
</html>
